# ============================================================================
# Star Merchants - linker configuration (LoROM, banks 00-01)
# ============================================================================
# ld65 writes memory areas into the output file sequentially, in the order
# they appear below. With fill=yes each area is padded to its full size:
#
#   ROM     size $7FC0 -> file offsets 0x0000-0x7FBF
#   HEADER  size $0020 -> file offsets 0x7FC0-0x7FDF (SNES internal header)
#   VECTORS size $0020 -> file offsets 0x7FE0-0x7FFF (interrupt vectors)
#   BANK1   size $8000 -> file offsets 0x8000-0xFFFF (LoROM bank 01,
#                           bulk const assets: font tiles. CPU address
#                           $018000+; reached via long addressing only)
#
# File offset F < $8000 maps to SNES CPU address $8000+F (bank 00 LoROM
# mapping), so all linker labels resolve to real addresses. The linked
# ROM is exactly 64 KB; scripts/build.ps1 pads it to 256 KB (matching
# the header's ROM size byte) and patches the checksum words.
# ============================================================================

FEATURES {
    STARTADDRESS: default = $8000;
}

SYMBOLS {
    __STACKSIZE__:  type = weak, value = $0800;
    __STACKSTART__: type = weak, value = $1FFF;
    __ZPSTART__:    type = weak, value = $0080;
}

MEMORY {
    ZP:      file = "", define = yes, start = $0080, size = $0080;
    WRAM:    file = "", define = yes, start = $0200, size = $1E00;
    ROM:     file = %O, start = $8000, size = $7FC0, fill = yes, fillval = $00;
    HEADER:  file = %O, start = $FFC0, size = $0020, fill = yes, fillval = $00;
    VECTORS: file = %O, start = $FFE0, size = $0020, fill = yes, fillval = $00;
    BANK1:   file = %O, start = $018000, size = $8000, fill = yes, fillval = $00;
}

SEGMENTS {
    ZEROPAGE:   load = ZP,      type = zp;
    STARTUP:    load = ROM,     type = ro,  align = $100;
    CODE:       load = ROM,     type = ro;
    RODATA:     load = ROM,     type = ro;
    DATA:       load = ROM,     type = rw;
    BSS:        load = WRAM,    type = bss, define = yes;
    HEADER:     load = HEADER,  type = ro;
    VECTORS:    load = VECTORS, type = ro;
    FARFONT:    load = BANK1,   type = ro;
    FARRODATA:  load = BANK1,   type = ro;
    FAR_DATA:   load = BANK1,   type = ro;
}

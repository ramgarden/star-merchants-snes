MEMORY {
    ZP:  start = $0010, size = $0020, type = rw, define = yes;
    RAM: start = $0200, size = $0E00, type = rw, define = yes;
    ROM: start = $1000, size = $EFFA, type = ro, fill = yes;
    VEC: start = $FFFA, size = $0006, type = ro;
}
SEGMENTS {
    ZEROPAGE: load = ZP,  type = zp;
    BSS:      load = RAM, type = bss, define = yes;
    RODATA:   load = ROM, type = ro;
    DATA:     load = RAM, type = rw;
    CODE:     load = ROM, type = ro;
    STARTUP:  load = ROM, type = ro;
    VECTORS:  load = VEC, type = ro;
}
